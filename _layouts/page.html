---
layout: default
---
<article class="wiki-page">
  <header class="page-header">
    <h1>{{ page.title }}</h1>
    {% if page.tags %}
    <div class="page-tags">
      {% for tag in page.tags %}
      <span class="tag">{{ tag }}</span>
      {% endfor %}
    </div>
    {% endif %}
  </header>
  <div class="page-content">
    {{ content }}
  </div>
</article>
